name: CICD-for-GE

on:
  push: 
    branches: [main]
    paths: 
      - '**.html'

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        run: echo "Checkout code"

  build:
    needs: code
    runs-on: ubuntu-latest
    steps:
      - name: Build Docker container
        run: echo "Build the container"

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Test the container
        run: echo "Testing the container"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy the app
        run: echo "Deploy the app"
